<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Job Application Form for Computer Science Students and Developers">
    <meta name="author" content="Shivam Raj">
    <title>Job Application Form - Stage 1</title>
</head>
<body>

    <header>
        <h1>Software Developer Job Application</h1>
        <p>Please fill out your personal and account details below to apply for the position.</p>
    </header>

    <main>
        <form action="#" method="post" enctype="multipart/form-data">
            
            <fieldset>
                <legend>Personal &amp; Account Details</legend>

                <label for="full-name">Full Name:</label><br>
                <input type="text" id="full-name" name="full_name" placeholder="Shivam Raj"><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" placeholder="shivam.raj@example.com"><br><br>

                <label for="password">Account Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Create a password"><br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="+91 XXXXXXXXXX"><br><br>

                <label for="portfolio-url">Portfolio or GitHub URL:</label><br>
                <input type="url" id="portfolio-url" name="portfolio_url" placeholder="https://github.com/username"><br><br>

                <label for="experience">Years of Experience:</label><br>
                <input type="number" id="experience" name="experience" min="0" max="50" placeholder="0"><br><br>
            </fieldset>

        </form>
    </main>

</body>
</html>
